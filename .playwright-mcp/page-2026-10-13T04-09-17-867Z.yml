      - generic [ref=e32]:
        - paragraph [ref=e33]: Founder
        - heading "Rawlings Munemo" [level=2] [ref=e34]
        - generic [ref=e35]:
          - paragraph [ref=e36]: "Rawlings founded Enotri Wine Imports with a simple goal: to bring wines to Alberta that express their true provenance and the dedication of the vineyard stewards who grow them — bottles that carry the mark of the people and places behind them."
          - paragraph [ref=e37]: He partners with independent producers from renowned and emerging regions, choosing wines that combine authenticity, quality, and harmony. Every estate brings something meaningful to the portfolio, whether through old vines, sustainable farming, indigenous varieties, family heritage, regional distinctiveness, or exceptional value.
          - paragraph [ref=e38]: "Each relationship is direct: he tastes in the growers' cellars and walks their vineyards before a single wine is listed."
