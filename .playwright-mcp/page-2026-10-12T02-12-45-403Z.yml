        - heading "Zaccagnini" [level=1] [ref=f2e20]
        - paragraph [ref=f2e21]: A landmark Abruzzo estate in Bolognano, farming Montepulciano and Trebbiano on the clay hills between the Majella mountains and the Adriatic since 1978.
    - generic [ref=f2e23]:
      - generic [ref=f2e24]:
        - paragraph [ref=f2e25]: The Story
        - paragraph [ref=f2e26]: Zaccagnini was founded in 1978 in Bolognano, a small village in the Pescara valley where the Majella massif meets the rolling hills that run down to the Adriatic. From a modest family holding, Marcello Zaccagnini built the estate into one of the reference names of Abruzzo, proving that Montepulciano from these clay hills could stand with the great reds of Italy.
        - paragraph [ref=f2e27]: The vineyards spread across more than 300 hectares of hillsides, farmed with a sustainable approach that respects the rhythms of the land between mountain and sea. Cold air descending from the Majella meets warm Adriatic breezes, a constant natural ventilation that keeps the fruit healthy and builds the freshness that marks every Zaccagnini wine.
        - paragraph [ref=f2e28]: "The estate's signature is the tralcetto — the small vine shoot tied by hand around the neck of every bottle, a gesture from the vineyards themselves. In the cellar, Montepulciano d'Abruzzo and Trebbiano are handled with the same care as in the vines: ripe red berry fruit, white pepper and soft, drinkable tannins, made to bring the character of Bolognano to tables everywhere."
