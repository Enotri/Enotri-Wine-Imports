        - img "Two hands cupping rich dark soil with earthworms, roots, and seedlings" [ref=e25]
      - generic [ref=e26]:
        - paragraph [ref=e27]: We believe the most important work happens in the vineyard, so we only take on estates that farm their own fruit. Before a wine is listed, someone here has walked those rows and tasted in that cellar with the person responsible for it.
        - paragraph [ref=e28]: That keeps the portfolio short on purpose. It also means that when a buyer asks why a wine tastes the way it does, or how it was farmed, there is a real answer rather than a marketing line — and a price that an Alberta list can actually carry.
    - generic [ref=e30]:
